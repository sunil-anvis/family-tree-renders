<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
    <div id="mobile-drawer-overlay" class="mobile-drawer-overlay" tabindex="-1"></div>

    <!-- Mobile Drawer Header -->
    <div id="mobile-drawer-header" class="mobile-drawer-header">
        <h3>Menu</h3>
        <button class="mobile-drawer-close" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Mobile Drawer Container -->
    <div id="mobile-drawer-container" class="mobile-drawer-container">
        <!-- Controls Section -->
        <div id="view-controls" class="control-panel control-panel-mobile">
            <!-- Section 1: Views -->
            <div class="control-group">
                <span class="group-label">Views</span>
                <div class="btn-pill-group">
                    <button class="view-btn active" data-view="fan" title="Fan View"><i class="fa-solid fa-chart-pie"></i><span class="btn-label">Fan</span></button>
                    <button class="view-btn" data-view="isometric" title="3D View"><i class="fa-solid fa-cube"></i><span class="btn-label">3D</span></button>
                    <button class="view-btn" data-view="pedigree" title="Pedigree View"><i class="fa-solid fa-users-rectangle"></i><span class="btn-label">Pedigree</span></button>
                    <button class="view-btn" data-view="real3d" title="Real 3D View"><i class="fa-solid fa-earth-americas"></i><span class="btn-label">Real 3D</span></button>
                </div>
            </div>

            <!-- Section 2: Focus -->
            <!-- <div class="control-group">
                <span class="group-label">Focus</span>
                <div class="btn-pill-group">
                    <button id="my-family" class="focus-btn" title="My Family"><i class="fa-solid fa-house-user"></i><span class="btn-label">My Family</span></button>
                    <button id="maternal-family" class="focus-btn" title="Maternal Side"><i class="fa-solid fa-venus"></i><span class="btn-label">Maternal</span></button>
                    <button id="wife-family" class="focus-btn" title="Wife / External"><i class="fa-solid fa-ring"></i><span class="btn-label">Wife</span></button>
                    <button id="individual-family" class="focus-btn" title="Individual Family"><i class="fa-solid fa-user"></i><span class="btn-label">Individual</span></button>
                </div>
            </div> -->

            <div id="fan-controls-mobile" class="sub-controls fan-controls-group" style="display: none;">
                <input type="checkbox" id="ancestor-mode-mobile" class="form-check-input ancestor-mode-toggle">
                <label for="ancestor-mode-mobile">Parents Mode</label>
                <div class="fan-nav-btns">
                    <button id="fan-back-btn-mobile" class="fan-nav-btn" title="Go Back" disabled>
                        <i class="fa-solid fa-arrow-left"></i><span class="btn-label">Back</span>
                    </button>
                    <button id="fan-reset-btn-mobile" class="fan-nav-btn fan-reset-btn" title="Reset to Start">
                        <i class="fa-solid fa-house"></i><span class="btn-label">Reset</span>
                    </button>
                </div>
            </div>

            <div id="iso-controls-mobile" class="sub-controls iso-controls-group" style="display: none;">
                <button class="btn-icon" onclick="setIsoAngle('iso')" title="Default"><i class="fa-solid fa-cube"></i></button>
                <button class="btn-icon" onclick="setIsoAngle('top')" title="Top"><i class="fa-solid fa-layer-group"></i></button>
                <button class="btn-icon" onclick="setIsoAngle('front')" title="Front"><i class="fa-solid fa-border-all"></i></button>
            </div>

            <div id="real3d-controls-mobile" class="sub-controls real3d-controls-group" style="display: none;">
                <button class="btn-icon" onclick="moveReal3D('left')" title="Move Left"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="btn-icon" onclick="moveReal3D('up')" title="Move Up"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="btn-icon" onclick="moveReal3D('down')" title="Move Down"><i class="fa-solid fa-arrow-down"></i></button>
                <button class="btn-icon" onclick="moveReal3D('right')" title="Move Right"><i class="fa-solid fa-arrow-right"></i></button>
                <button class="btn-icon" onclick="moveReal3D('zoomIn')" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button class="btn-icon" onclick="moveReal3D('zoomOut')" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            </div>

            <!-- Section 3: Export & Tools -->
            <div class="control-group">
                <span class="group-label">Tools</span>
                <div class="btn-pill-group">
                    <button id="theme-toggle-mobile" class="theme-toggle export-btn-sm" title="Toggle Theme">
                        <i class="fa-solid fa-sun"></i><span class="btn-label">Theme</span>
                    </button>
                    <button id="download-btn-mobile" class="download-open-btn export-btn-sm" title="Download Tree" aria-label="Download Tree">
                        <i class="fa-solid fa-download"></i><span class="btn-label">Download</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Family Members Section (below controls) -->
        <div id="fan-member-sidebar" class="member-sidebar member-sidebar-mobile">
            <div class="sidebar-header">
                <h4>Family Members</h4>
                <input type="text" id="member-search-mobile" placeholder="Search members..." class="form-control form-control-sm member-search-input">
            </div>
            <div id="member-list-mobile" class="member-list-container sidebar-list">
                <!-- Members will be populated here -->
            </div>
        </div>
    </div>

    <!-- Desktop control panel (hidden on mobile) -->
    <div id="view-controls-desktop" class="control-panel control-panel-desktop">
        <!-- Section 1: Views -->
        <div class="control-group">
            <span class="group-label">Views</span>
                <div class="btn-pill-group">
                    <button class="view-btn active" data-view="fan" title="Fan View"><i class="fa-solid fa-chart-pie"></i></button>
                    <button class="view-btn" data-view="isometric" title="3D View"><i class="fa-solid fa-cube"></i></button>
                    <button class="view-btn" data-view="pedigree" title="Pedigree View"><i class="fa-solid fa-users-rectangle"></i></button>
                    <button class="view-btn" data-view="real3d" title="Real 3D View"><i class="fa-solid fa-earth-americas"></i></button>
                </div>
        </div>

        <!-- Section 2: Focus -->
        <!-- <div class="control-group">
            <span class="group-label">Focus</span>
            <div class="btn-pill-group">
                <button id="my-family" class="focus-btn" title="My Family"><i class="fa-solid fa-house-user"></i></button>
                <button id="maternal-family" class="focus-btn" title="Maternal Side"><i class="fa-solid fa-venus"></i></button>
                <button id="wife-family" class="focus-btn" title="Wife / External"><i class="fa-solid fa-ring"></i></button>
                <button id="individual-family" class="focus-btn" title="Individual Family"><i class="fa-solid fa-user"></i></button>
            </div>
        </div> -->

        <div id="fan-controls-desktop" class="sub-controls fan-controls-group" style="display: none;">
            <input type="checkbox" id="ancestor-mode-desktop" class="form-check-input ancestor-mode-toggle">
            <label for="ancestor-mode-desktop">Parents Mode</label>
            <div class="fan-nav-btns">
                <button id="fan-back-btn-desktop" class="fan-nav-btn" title="Go Back" disabled>
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <button id="fan-reset-btn-desktop" class="fan-nav-btn fan-reset-btn" title="Reset to Start">
                    <i class="fa-solid fa-house"></i>
                </button>
            </div>
        </div>

        <div id="iso-controls-desktop" class="sub-controls iso-controls-group" style="display: none;">
            <button class="btn-icon" onclick="setIsoAngle('iso')" title="Default"><i class="fa-solid fa-cube"></i></button>
            <button class="btn-icon" onclick="setIsoAngle('top')" title="Top"><i class="fa-solid fa-layer-group"></i></button>
            <button class="btn-icon" onclick="setIsoAngle('front')" title="Front"><i class="fa-solid fa-border-all"></i></button>
        </div>

        <div id="real3d-controls-desktop" class="sub-controls real3d-controls-group" style="display: none;">
            <div class="nav-btn-inner-group">
                <button class="btn-icon" onclick="moveReal3D('left')" title="Move Left"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="btn-icon" onclick="moveReal3D('up')" title="Move Up"><i class="fa-solid fa-arrow-up"></i></button>
                <button class="btn-icon" onclick="moveReal3D('down')" title="Move Down"><i class="fa-solid fa-arrow-down"></i></button>
                <button class="btn-icon" onclick="moveReal3D('right')" title="Move Right"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="nav-btn-inner-group" style="margin-left: 10px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px;">
                <button class="btn-icon" onclick="moveReal3D('zoomIn')" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button class="btn-icon" onclick="moveReal3D('zoomOut')" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
            </div>
            <div class="nav-btn-inner-group" style="margin-left: 10px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 10px;">
                <button class="btn-icon real3d-back-btn" onclick="backReal3D()" title="Go Back History" disabled><i class="fa-solid fa-rotate-left"></i></button>
                <button class="btn-icon" onclick="resetReal3D()" title="Reset to Home"><i class="fa-solid fa-house"></i></button>
            </div>
        </div>

        <!-- Section 3: Export & Tools -->
        <div class="control-group ms-auto">
            <span class="group-label">Tools</span>
            <div class="btn-pill-group">
                <button id="theme-toggle-desktop" class="theme-toggle export-btn-sm" title="Toggle Theme">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button id="download-btn-desktop" class="download-open-btn export-btn-sm" title="Download Tree" aria-label="Download Tree">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Desktop Member Sidebar -->
    <div id="fan-member-sidebar-desktop" class="member-sidebar member-sidebar-desktop">
        <div class="sidebar-header">
            <h4>Family Members</h4>
            <input type="text" id="member-search-desktop" placeholder="Search members..." class="form-control form-control-sm member-search-input">
        </div>
        <div id="member-list-desktop" class="member-list-container sidebar-list">
            <!-- Members will be populated here -->
        </div>
    </div>

    <div id="tree-container"></div>

    <!-- Member Options Modal -->
    <div id="member-options-modal" class="member-options-modal">
        <div class="member-options-content">
            <button class="modal-close-btn" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            <div class="member-options-header">
                <img id="member-options-photo" src="" alt="Member" class="member-options-photo">
                <div class="member-options-info">
                    <h3 id="member-options-name">Name</h3>
                    <p id="member-options-relation">Relation</p>
                </div>
            </div>
            <div class="member-options-actions">
                <button id="view-details-btn" class="member-action-btn details-btn">
                    <i class="fa-solid fa-user"></i>
                    <span>View Details</span>
                </button>
                <button id="view-tree-btn" class="member-action-btn tree-btn">
                    <i class="fa-solid fa-sitemap"></i>
                    <span>View Their Tree</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Export Selection Modal -->
    <div id="export-selection-modal" class="member-options-modal">
        <div class="member-options-content export-selection-content">
            <button class="modal-close-btn" aria-label="Close" id="close-export-modal"><i class="fa-solid fa-xmark"></i></button>
            <div class="member-options-header">
                <div class="export-icon-header">
                    <i class="fa-solid fa-cloud-arrow-down" style="font-size: 40px; color: var(--neon-cyan); margin-bottom: 10px; display: block;"></i>
                </div>
                <h3 class="export-modal-title">Download Tree</h3>
                <p class="export-modal-subtitle">Select a format to save your current view.</p>
            </div>
            <div class="member-options-actions export-format-actions">
                <button class="member-action-btn export-format-btn" data-format="jpg">
                    <i class="fa-solid fa-image" style="color: #4ecca3;"></i>
                    <span>High Quality JPG</span>
                </button>
                <button class="member-action-btn export-format-btn" data-format="png">
                    <i class="fa-regular fa-image" style="color: #64b5f6;"></i>
                    <span>Transparent PNG</span>
                </button>
                <button class="member-action-btn export-format-btn" data-format="pdf">
                    <i class="fa-solid fa-file-pdf" style="color: #f48fb1;"></i>
                    <span>Printable PDF</span>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>



    <!-- Three.js for Real 3D View -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="transform-api-data.js"></script>

    <script src="3d-view.js"></script>
    <script src="real-3d-view.js"></script>
    <script src="pedigree-view.js"></script> <!-- Pedigree View -->
    <script src="data.js"></script>
    <script src="index.js"></script>
</body>

</html>
