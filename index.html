<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="view-controls" class="control-panel">
        <!-- Section 1: Views -->
        <div class="control-group">
            <span class="group-label">Views</span>
            <div class="btn-pill-group">
                <button class="view-btn" data-view="globe" title="Globe View"><i class="fa-solid fa-earth-americas"></i></button>
                <button class="view-btn" data-view="tree" title="Tree View"><i class="fa-solid fa-tree"></i></button>
                <button class="view-btn active" data-view="vertical-tree" title="Vertical Tree"><i class="fa-solid fa-sitemap"></i></button>
                <button class="view-btn" data-view="fan" title="Fan View"><i class="fa-solid fa-chart-pie"></i></button>
                <button class="view-btn" data-view="isometric" title="3D View"><i class="fa-solid fa-cube"></i></button>
                <button class="view-btn" data-view="pedigree" title="Pedigree View"><i class="fa-solid fa-users-rectangle"></i></button>
            </div>
        </div>

        <!-- Section 2: Focus -->
        <div class="control-group">
            <span class="group-label">Focus</span>
            <div class="btn-pill-group">
                <button id="my-family" class="focus-btn" title="My Family"><i class="fa-solid fa-house-user"></i></button>
                <button id="maternal-family" class="focus-btn" title="Maternal Side"><i class="fa-solid fa-venus"></i></button>
                <button id="wife-family" class="focus-btn" title="Wife / External"><i class="fa-solid fa-ring"></i></button>
                <button id="individual-family" class="focus-btn" title="Individual Family"><i class="fa-solid fa-user"></i></button>
            </div>
        </div>

        <div id="fan-controls" class="sub-controls" style="display: none;">
            <input type="checkbox" id="ancestor-mode" class="form-check-input">
            <label for="ancestor-mode">Parents Mode</label>
        </div>

        <div id="iso-controls" class="sub-controls" style="display: none;">
            <button class="btn-icon" onclick="setIsoAngle('iso')" title="Default"><i class="fa-solid fa-cube"></i></button>
            <button class="btn-icon" onclick="setIsoAngle('top')" title="Top"><i class="fa-solid fa-layer-group"></i></button>
            <button class="btn-icon" onclick="setIsoAngle('front')" title="Front"><i class="fa-solid fa-border-all"></i></button>
        </div>

        <!-- Section 3: Export & Tools -->
        <div class="control-group ms-auto">
            <span class="group-label">Tools</span>
            <div class="btn-pill-group">
                <button id="theme-toggle" class="export-btn-sm" style="color: #FFD700; background: rgba(255, 215, 0, 0.15);" title="Toggle Theme">
                    <i class="fa-solid fa-sun"></i>
                </button>
                <button id="download-jpg" class="export-btn-sm" title="Download JPG">
                    <i class="fa-solid fa-image"></i>
                </button>
                <button id="download-png" class="export-btn-sm" title="Download PNG">
                    <i class="fa-regular fa-image"></i>
                </button>
                <button id="download-pdf" class="export-btn-sm" title="Download PDF">
                    <i class="fa-solid fa-file-pdf"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Fan View Member Sidebar -->
    <div id="fan-member-sidebar" class="member-sidebar">
        <div class="sidebar-header">
            <h4>Family Members</h4>
            <input type="text" id="member-search" placeholder="Search members..." class="form-control form-control-sm">
        </div>
        <div id="member-list" class="sidebar-list">
            <!-- Members will be populated here -->
        </div>
    </div>


    <div id="tree-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Three.js (Core) -->
    <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Globe.gl (Includes Three.js) -->
    <script src="//unpkg.com/globe.gl"></script>

    <script src="https://unpkg.com/topojson@3"></script>
    <script src="transform-api-data.js"></script>
    <script src="globe_view.js"></script>
    <script src="3d-view.js"></script>
    <script src="try-3d-view.js"></script> <!-- New True 3D View -->
    <script src="pedigree-view.js?v=8"></script> <!-- Pedigree View -->
    <script src="index.js"></script>
</body>

</html>
