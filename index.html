<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="view-controls">
        <button class="view-btn" data-view="globe">Globe View</button>
        <button class="view-btn" data-view="tree">Tree View</button>
        <button class="view-btn active" data-view="vertical-tree">Vertical Tree</button>
        <button class="view-btn" data-view="fan">Fan View</button>
        <button class="view-btn" data-view="isometric">3D View</button>

        <!-- Family Focus Controls -->
        <div style="margin-left: 15px; display: flex; gap: 6px;">
            <button id="my-family" class="btn btn-sm btn-outline-dark">My Family</button>
            <button id="maternal-family" class="btn btn-sm btn-outline-dark">Maternal Side</button>
            <button id="wife-family" class="btn btn-sm btn-outline-dark">Wife / External</button>
        </div>

        <div id="fan-controls" style="display: none; margin-left: 10px; align-items: center;">
            <input type="checkbox" id="ancestor-mode" class="form-check-input" style="margin-right: 5px;">
            <label for="ancestor-mode" style="color: white; font-family: sans-serif; font-size: 14px; cursor: pointer;">
                Parents Mode
            </label>
        </div>

        <div id="iso-controls"
            style="display: none; margin-left: 10px; align-items: center; gap: 5px; flex-wrap: wrap;">
            <button class="btn btn-sm btn-dark" onclick="setIsoAngle('iso')">Default</button>
            <button class="btn btn-sm btn-dark" onclick="setIsoAngle('top')">Top</button>
            <button class="btn btn-sm btn-dark" onclick="setIsoAngle('front')">Front</button>
        </div>
    </div>


    <div id="tree-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

    <!-- Three.js (Core) -->
    <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Globe.gl (Includes Three.js) -->
    <script src="//unpkg.com/globe.gl"></script>

    <script src="https://unpkg.com/topojson@3"></script>
    <script src="transform-api-data.js"></script>
    <script src="globe_view.js"></script>
    <script src="3d-view.js"></script>
    <script src="try-3d-view.js"></script> <!-- New True 3D View -->
    <script src="index.js"></script>
</body>

</html>
