<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="view-controls">
        <button class="view-btn" data-view="globe">Globe View</button>
        <button class="view-btn" data-view="tree">Tree View</button>
        <button class="view-btn active" data-view="vertical-tree">Vertical Tree</button>
        <button class="view-btn" data-view="fan">Fan View</button>
        <button class="view-btn" data-view="isometric">3D View</button>
        <div id="fan-controls" style="display: none; margin-left: 10px; align-items: center;">
            <input type="checkbox" id="ancestor-mode" class="form-check-input" style="margin-right: 5px;">
            <label for="ancestor-mode"
                style="color: white; font-family: sans-serif; font-size: 14px; cursor: pointer;">Parents Mode</label>
        </div>
    </div>
    <div id="zoom-controls">
        <button id="zoom-in" class="btn btn-dark">+</button>
        <button id="zoom-out" class="btn btn-dark">-</button>
    </div>
    <div id="tree-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <script src="index.js"></script>
</body>

</html>
